<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-200">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .id-card-glow { box-shadow: 0 0 30px rgba(6, 182, 212, 0.2); }
        .wireframe-face { border: 2px solid #06b6d4; background: rgba(0,0,0,0.3); position: relative; }
        .wireframe-face::after { content: "GRID SILHOUETTE"; color: #06b6d4; font-size: 10px; text-align: center; display: block; margin-top: 40%; }
    </style>
</head>
<body class="p-8 max-w-6xl mx-auto">

    <div class="grid md:grid-cols-2 gap-12">
        <!-- LIVE ID CARD -->
        <div id="id-card" class="id-card-glow w-full max-w-md h-72 bg-slate-900 border border-cyan-500/50 p-6 rounded-lg flex gap-6">
            <div class="wireframe-face w-32 h-full flex-shrink-0"></div>
            <div class="flex flex-col justify-between w-full">
                <div>
                    <div id="display-name" class="text-xl font-bold uppercase text-cyan-400">YOUR NAME</div>
                    <div class="mt-4 text-[10px] uppercase opacity-80">Digital Human Status</div>
                    <div class="text-cyan-300 font-bold">NEUTRALIZING synthetic FRAUD</div>
                </div>
                <div class="text-[10px] uppercase">
                    <p>Bridges Active: <span id="bridge-count">0</span>/38</p>
                    <p>Randomized Sovereign ID: <span class="text-cyan-400">XXX-XXX-XXX</span></p>
                    <p>Digital Human Class: <span class="text-cyan-400">TBA</span></p>
                    <p>Valid Through: <span class="text-cyan-400">2029</span></p>
                </div>
            </div>
        </div>

        <!-- FORM INPUTS -->
        <div>
            <input id="nameInput" type="text" placeholder="Enter Full Name" class="w-full bg-black border border-cyan-900 p-3 mb-6 rounded text-cyan-400 uppercase font-bold">
            <div class="max-h-[400px] overflow-y-auto space-y-2 border border-slate-800 p-4">
                <!-- Bridge Checkboxes -->
                <script>
                    const bridges = ["B-01 Auth Root", "B-02 Civic Core", "B-03 HR Liaison", "B-04 Civic Ballot", "B-05 Ambient Auth", "B-06 Keystone Plate", "B-07 Entra Defense", "B-08 Physical UAC", "B-09 DMV Authority", "B-10 Fiscal Root", "B-11 Pet Likeness", "B-12 Vital Records", "B-13 Medical Root", "B-14 Property Deeds", "B-15 Safe Owner", "B-16 Satoshi Root", "B-17 Professional", "B-18 SSA Tokenizer", "B-19 Bio-Sign", "B-20 Escrow Ruler", "B-21 Citadel Escrow", "B-22 DTC Travel", "B-23 Amex Anchor", "B-24 Credit Authority", "B-25 Insurance", "B-26 Mastercard Rail", "B-27 Academic Root", "B-28 Global Notary", "B-29 Logistics Sync", "B-30 Auto Anchor", "B-31 AII Economy", "B-32 God Sense", "B-33 Benthic Pulse", "B-34 Oracle Flux", "B-35 Justice Rail", "B-36 Doge Bridge", "B-37 Federal Sync", "B-38 Precinct Root"];
                    bridges.forEach((b, i) => {
                        document.write(`<label class="flex justify-between items-center text-[10px] hover:bg-slate-800 p-1 cursor-pointer">
                            <span>${b}</span>
                            <span class="text-cyan-600">$15.00/mo</span>
                            <input type="checkbox" class="bridge-check" onchange="updateStats()">
                        </label>`);
                    });
                </script>
            </div>
        </div>
    </div>

    <script>
        // Real-time updates
        const nameInput = document.getElementById('nameInput');
        const displayName = document.getElementById('display-name');
        
        nameInput.addEventListener('input', (e) => {
            displayName.innerText = e.target.value || "YOUR NAME";
        });

        function updateStats() {
            const checked = document.querySelectorAll('.bridge-check:checked').length;
            document.getElementById('bridge-count').innerText = checked;
        }
    </script>
</body>
</html>
