<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Human Mainframe | REALAiID Sign-In</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Montserrat:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bureau-blue: #001f3f;
            --bureau-gold: #b8860b;
            --accent-blue: #1693E9;
            --soft-gray: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--soft-gray); 
            color: var(--text-main); 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            position: relative;
        }

        /* Interactive Background Layer */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Institutional Frame */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 15px solid #fff;
            pointer-events: none;
            z-index: 10000;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.02);
        }

        .auth-card { 
            width: 100%;
            max-width: 460px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(25px);
            padding: 60px 45px; 
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.08);
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .header-section { margin-bottom: 45px; }
        .bureau-title { 
            font-family: 'Libre Baskerville'; 
            color: var(--bureau-blue); 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            font-size: 1.6rem; 
            margin-bottom: 8px;
        }
        .mainframe-sub {
            font-family: 'JetBrains Mono';
            font-size: 0.65rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .input-group { text-align: left; margin-bottom: 24px; }
        label { 
            display: block; 
            font-family: 'JetBrains Mono'; 
            font-size: 0.65rem; 
            color: #94a3b8; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            font-weight: 800;
        }
        input { 
            width: 100%; 
            padding: 18px 24px; 
            background: #f1f5f9; 
            border: 2px solid transparent; 
            border-radius: 16px;
            color: var(--text-main); 
            font-family: 'Montserrat'; 
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.4s ease;
        }
        input:focus { 
            outline: none; 
            border-color: var(--accent-blue); 
            background: #fff;
            box-shadow: 0 15px 30px rgba(22, 147, 233, 0.08);
        }

        .btn-access { 
            width: 100%; 
            padding: 22px; 
            background: var(--bureau-blue); 
            color: #fff; 
            border: none; 
            border-radius: 16px;
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.9rem;
            box-shadow: 0 20px 40px rgba(0, 31, 63, 0.15);
        }
        .btn-access:hover { background: var(--accent-blue); transform: translateY(-3px); }

        .divider { 
            margin: 45px 0; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            color: #cbd5e1; 
            font-family: 'JetBrains Mono'; 
            font-size: 0.6rem; 
            letter-spacing: 3px; 
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }

        .biosign-section {
            background: #fff;
            border: 2px solid #f1f5f9;
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .biosign-section:hover { 
            border-color: var(--bureau-gold); 
            box-shadow: 0 20px 40px rgba(184, 134, 11, 0.1); 
            transform: translateY(-2px);
        }

        /* FIXED LOGO PATH: biosigntrademarklogo.png at root level */
        .biosign-logo-img {
            height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .biosign-label {
            font-family: 'JetBrains Mono';
            font-weight: 800;
            font-size: 0.7rem;
            color: var(--bureau-gold);
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        #portal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.99);
            z-index: 20000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .scan-ring {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            position: relative;
            margin-bottom: 50px;
            overflow: hidden;
            background: #000;
        }
        .scan-ring video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .laser {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-blue);
            animation: laser-scan 3s infinite ease-in-out;
        }
        @keyframes laser-scan { 0%, 100% { top: 0; } 50% { top: 100%; } }

        .footer-links {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer-links a { color: var(--accent-blue); text-decoration: none; margin: 0 15px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="auth-card">
        <div class="header-section">
            <div class="bureau-title">REALAiID</div>
            <div class="mainframe-sub">Digital Human Mainframe</div>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Digital Human Candidate ID</label>
                <input type="text" placeholder="ARC-XXXX-XXXX" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-access">Enter Mainframe</button>
        </form>

        <div class="divider">OR EXECUTE BIOSIGN™</div>

        <!-- CORRECTED PATH: biosigntrademarklogo.png at root level -->
        <div class="biosign-section" onclick="openBioPortal()">
            <img src="biosigntrademarklogo.png" alt="BioSign™ Logo" class="biosign-logo-img" onerror="this.src='https://via.placeholder.com/300x100/ffffff/b8860b?text=BioSign™+Syncing...'">
            <div class="biosign-label">Biometric Sign-In Signature</div>
        </div>

        <div class="footer-links">
            <a href="index.html">Registry Gate</a> | <a href="identity-station.html">Claim Identity</a>
        </div>
    </div>

    <!-- Biometric Handshake Modal -->
    <div id="portal-overlay">
        <div class="bureau-title" style="margin-bottom: 10px; font-size: 2rem;">BioSign™</div>
        <div class="mainframe-sub" style="margin-bottom: 50px; font-size: 0.8rem;">Authenticating Biometric Sign-In Signature</div>
        
        <div class="scan-ring">
            <div class="laser"></div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="bio-status" style="font-family: 'JetBrains Mono'; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 3px; font-size: 1.1rem;">Awaiting Biological Input...</div>
        
        <button class="btn-access" style="max-width: 340px; margin-top: 50px;" onclick="processBioHandshake()">Capture Bio-Signature</button>
        <button onclick="closeBioPortal()" style="margin-top: 25px; background: none; border: none; color: #94a3b8; cursor: pointer; font-family: 'JetBrains Mono'; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;">Cancel Access</button>
    </div>

    <script>
        /* --- INTERACTIVE 3D NEURAL BACKGROUND --- */
        let scene, camera, renderer, cloud, starGeo;
        let mouseX = 0, mouseY = 0;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI / 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            starGeo = new THREE.BufferGeometry();
            let stars = [];
            for(let i=0; i<6000; i++) {
                stars.push(Math.random() * 600 - 300, Math.random() * 600 - 300, Math.random() * 600 - 300);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
            
            let starMaterial = new THREE.PointsMaterial({
                color: 0x1693E9,
                size: 0.5,
                transparent: true,
                opacity: 0.3
            });

            cloud = new THREE.Points(starGeo, starMaterial);
            scene.add(cloud);

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) / 60;
                mouseY = (e.clientY - window.innerHeight / 2) / 60;
            });
            animate();
        }

        function animate() {
            let positions = starGeo.attributes.position.array;
            for(let i=0; i<positions.length; i+=3) {
                positions[i+1] -= 0.1; 
                if (positions[i+1] < -300) positions[i+1] = 300;
            }
            starGeo.attributes.position.needsUpdate = true;
            
            cloud.rotation.y += 0.001;
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();

        let stream = null;
        async function openBioPortal() {
            const overlay = document.getElementById('portal-overlay');
            overlay.style.display = 'flex';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                document.getElementById('bio-status').innerText = "Hardware Inactive";
            }
        }

        function closeBioPortal() {
            document.getElementById('portal-overlay').style.display = 'none';
            if (stream) stream.getTracks().forEach(track => track.stop());
        }

        function processBioHandshake() {
            const status = document.getElementById('bio-status');
            status.innerText = "Hashing Biometric Root...";
            status.style.color = "#b8860b";
            setTimeout(() => {
                status.innerText = "BioSign™ Verified. Opening Mainframe...";
                status.style.color = "#18B494";
                localStorage.setItem('REALAiID_AUTH_TOKEN', 'DIGITAL_HUMAN_ACTIVE');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            }, 2500);
        }

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            localStorage.setItem('REALAiID_AUTH_TOKEN', 'DIGITAL_HUMAN_ACTIVE');
            window.location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
