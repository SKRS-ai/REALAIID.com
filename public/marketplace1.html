        function renderProducts(filteredProducts) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            filteredProducts.forEach(p => {
                const card = document.createElement('a');
                card.href = p.link;
                card.className = "product-card bg-slate-800 rounded-3xl overflow-hidden block hover:ring-2 hover:ring-cyan-400 border border-slate-700 transition-all duration-300";
                card.innerHTML = `
                    <div class="h-56 bg-slate-700 flex items-center justify-center text-6xl">${p.icon || '🔑'}</div>
                    <div class="p-6">
                        <h3 class="font-semibold text-white text-xl mb-1">${p.name}</h3>
                        <p class="text-cyan-400 text-2xl font-bold">${p.price}</p>
                        <p class="text-slate-400 text-sm mt-3 line-clamp-2">${p.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btnElement) {
            // Reset all buttons to default inactive state
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.remove('bg-cyan-400', 'text-slate-900');
                btn.classList.add('text-slate-300');
            });
            
            // Apply active state to clicked button
            if (btnElement) {
                btnElement.classList.add('bg-cyan-400', 'text-slate-900');
                btnElement.classList.remove('text-slate-300');
            }
            
            // Filter array rendering
            if (cat === 'all') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        // Initial render
        renderProducts(products);
